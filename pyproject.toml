[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.4.0"
description = "Security scanner for AI agents and MCP servers: tool poisoning, prompt injection and IAM blast-radius."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Geetikaa Suresh Kumar" }]
keywords = ["mcp", "security", "ai-agents", "prompt-injection", "scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
aws = ["boto3>=1.34"]
llm = ["anthropic>=0.40"]

[project.scripts]
agentguard = "agentguard.cli:main"

[project.urls]
Homepage = "https://github.com/Geetired/agentguard"

[tool.setuptools]
packages = ["agentguard"]
