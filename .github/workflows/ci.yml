name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write  # required to upload SARIF to the Security tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Benchmark detection over the corpus
        run: python -m agentguard.cli benchmark samples
      - name: Scan the malicious corpus and emit SARIF
        run: |
          python -m agentguard.cli scan samples/malicious/poisoned_tools.json \
            --no-color --sarif agentguard.sarif || true
      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentguard.sarif
      - name: Benign corpus must be clean
        run: python -m agentguard.cli scan samples/benign/clean_tools.json --no-color --fail-on low
