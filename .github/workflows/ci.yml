name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Self-scan sample corpus (should flag malicious, exit non-zero)
        run: |
          python -m agentguard.cli scan samples/malicious/poisoned_tools.json --no-color || true
      - name: Benign corpus must be clean
        run: python -m agentguard.cli scan samples/benign/clean_tools.json --no-color --fail-on low
